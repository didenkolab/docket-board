# The projects this vault holds, and the vocabulary they share.
# A key is PROJECT-NUMBER and the project is a folder at the root.
# transitions is the workflow; leaving it out means anything can move
# to anything.
name: docket
projects:
  - key: DKT
    name: docket
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: Done
    category: done
  - name: Dropped
    category: done
types:
  - name: epic
    level: 1
  - task
  - bug
  - story
  - name: subtask
    level: -1
priorities:
  - low
  - normal
  - high
  - urgent
pages:
  - name: time-in-status
    title: Time in status
    run: hooks/time-in-status.sh
  - name: anomalies
    title: Anomalies
    run: hooks/anomalies.sh
apps:
  - name: time_in_status
    source: /Volumes/Develop/develop/docket-apps#time-in-status
    version: "1"
  - name: anomalies
    source: /Volumes/Develop/develop/docket-apps#anomalies
    version: "1"
sign_in:
  device_client_id: Ov23liIniOAW6leu5Lkn
