# The projects this vault holds, and the vocabulary they share.
# A key is PROJECT-NUMBER and the project is a folder at the root.
# transitions is the workflow; leaving it out means anything can move
# to anything.
name: docket
projects:
  - key: DKT
    name: docket
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: Done
    category: done
  - name: Dropped
    category: done
types:
  - name: epic
    level: 1
  - task
  - bug
  - story
  - name: subtask
    level: -1
priorities:
  - low
  - normal
  - high
  - urgent
fields:
  - name: definition_of_done
    label: Definition of done
    kind: choice
    choices:
      - team
      - release
      - hotfix
    help: Which list this work is held to. The lists themselves are documents.
pages:
  - name: time-in-status
    title: Time in status
    run: hooks/time-in-status.sh
  - name: anomalies
    title: Anomalies
    run: hooks/anomalies.sh
  - name: workload
    title: Workload
    run: hooks/workload.sh
  - name: acceptance
    title: Acceptance across the board
    run: hooks/across.sh
  - name: unsized
    title: Not sized
    run: hooks/unsized.sh
  - name: portfolio
    title: Portfolio
    run: hooks/portfolio.sh
panels:
  - name: progress
    title: Acceptance
    run: hooks/progress.sh
apps:
  - name: time_in_status
    source: /Volumes/Develop/develop/docket-apps#time-in-status
    version: "1"
  - name: anomalies
    source: /Volumes/Develop/develop/docket-apps#anomalies
    version: "1"
  - name: workload
    source: /Volumes/Develop/develop/docket-apps#workload
    version: "1"
  - name: checklists
    source: /Volumes/Develop/develop/docket-apps#checklists
    version: "1"
  - name: estimation
    source: /Volumes/Develop/develop/docket-apps#estimation
    version: "1"
  - name: portfolio
    source: /Volumes/Develop/develop/docket-apps#portfolio
    version: "1"
sign_in:
  device_client_id: Ov23liIniOAW6leu5Lkn
